# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

name: blogger
services:
    ai-project:
        host: azure.ai.project
        endpoint: https://AgentFrameworkJesseLiberty.services.ai.azure.com/api/projects/AgentFramework
    blogger:
        project: .
        host: azure.ai.agent
        language: csharp
        uses:
            - ai-project
        env:
            AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
        codeConfiguration:
            dependencyResolution: remote_build
            entryPoint: BlogWriter.HostedAgents.Blogger.dll
            runtime: dotnet_10
        container:
            resources:
                cpu: "0.5"
                memory: 1Gi
    blogwriter-blogger:
        project: .
        host: azure.ai.agent
        language: csharp
        uses:
            - ai-project
        codeConfiguration:
            dependencyResolution: remote_build
            entryPoint: BlogWriter.HostedAgents.Blogger.dll
            runtime: dotnet_10
        container:
            resources:
                cpu: "0.5"
                memory: 1Gi
        description: Routes the BlogWriter workflow to the next best step.
        environmentVariables:
            - name: AZURE_AI_MODEL_DEPLOYMENT_NAME
              value: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
        kind: hosted
        name: blogwriter-blogger
        protocols:
            - protocol: responses
              version: 2.0.0
infra:
    provider: microsoft.foundry
