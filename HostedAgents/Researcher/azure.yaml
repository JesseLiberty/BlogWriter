# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

name: blogwriter-hosted-agent-researcher
metadata:
    template: blogwriter-hosted-agent
services:
    ai-project:
        host: azure.ai.project
    blogwriter-researcher:
        project: .
        host: azure.ai.agent
        language: csharp
        uses:
            - ai-project
        description: Performs web research for blog posts.
        codeConfiguration:
            dependencyResolution: remote_build
            entryPoint: bin/Debug/net10.0/BlogWriter.HostedAgents.Researcher.dll
            runtime: dotnet_10
        container:
            resources:
                cpu: "0.5"
                memory: 1Gi
        kind: hosted
        name: blogwriter-researcher
        environmentVariables:
            - name: AZURE_AI_MODEL_DEPLOYMENT_NAME
              value: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
        protocols:
            - protocol: responses
              version: 2.0.0
